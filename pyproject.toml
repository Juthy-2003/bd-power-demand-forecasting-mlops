[project]
name = "powerfc"
version = "0.1.0"
description = "Bangladesh power demand forecasting with a continuous-training MLOps pipeline"
authors = [
    { name = "Juthy", email = "20213654508juthy@juniv.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "fastapi>=0.143.0",
    "holidays>=0.106",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["integration: needs running services (MLflow, Postgres)"]

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["*.py"]
extend-exclude = ["mlruns", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S608", "B008"]  # B008: FastAPI's Query() defaults are the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"bench/*" = ["S", "E501"]
"scripts/*" = ["S"]

[project.scripts]
powerfc = "powerfc.pipeline:main"
