name: Deliver

# Push to main: build multi-arch images (amd64 + arm64, because the Oracle
# A1 node is ARM) → GHCR, then upgrade the Helm release on the k3s node.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: powerfc-app, file: Dockerfile }
          - { name: powerfc-mlflow, file: Dockerfile.mlflow }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Skipped until the cluster exists: add the KUBECONFIG_OCI secret (the
    # node's kubeconfig; port 6443 is open only to admin_cidr, so use a
    # self-hosted runner or widen admin_cidr to GitHub's ranges consciously).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.KUBECONFIG_OCI }}" > kubeconfig
      - run: |
          helm upgrade --install powerfc deploy/helm/powerfc --kubeconfig kubeconfig \
            --namespace powerfc --create-namespace --wait --timeout 10m \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/powerfc-app,image.tag=${{ github.sha }} \
            --set mlflowImage.repository=ghcr.io/${{ github.repository_owner }}/powerfc-mlflow,mlflowImage.tag=${{ github.sha }}
      - run: kubectl --kubeconfig kubeconfig -n powerfc rollout status deploy/api
