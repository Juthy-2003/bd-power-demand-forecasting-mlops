{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powerfc
  labels: {{- include "powerfc.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          # Public: the forecast API (docs at /docs). MLflow and Postgres stay
          # cluster-internal; use `kubectl port-forward` to reach them.
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 8000 } } } }
{{- end }}
