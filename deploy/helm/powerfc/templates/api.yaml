apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "powerfc.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "powerfc.pipelineEnv" . | nindent 12 }}
            - { name: MLFLOW_HTTP_REQUEST_MAX_RETRIES, value: "1" }
            - { name: MLFLOW_HTTP_REQUEST_TIMEOUT, value: "5" }
          ports: [{ containerPort: 8000, name: http }]
          # Startup gives the process time to import its libraries; liveness
          # then restarts a stuck process; readiness keeps traffic away until
          # the champion's metadata has loaded from MLflow.
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "powerfc.labels" . | nindent 4 }}
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: http, name: http }]
